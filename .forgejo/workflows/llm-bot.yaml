jobs:
  respond:
    container:
      image: git.zarantonello.dev/infra/forgejo-agent:ci@sha256:d1463c404d50ac078446d364705009165e2b66729256c8c3c76516d03ba4bd3e
    name: LLM Bot response generation
    runs-on: srv-0-thi-home
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ secrets.AGENT_TOKEN }}@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - name: Generate response
        uses: https://git.zarantonello.dev/infra/forgejo-agent@main
        with:
          issue_number: ${{ forge.event.issue.number }}
          model: Qwen3.6-35B-A3B
          models_json: |
            {"providers":{"llama-server":{"baseUrl":"http://llama.zarantonello.dev/v1","api":"openai-completions","apiKey":"llama","models":[{"id":"Qwen3.6-35B-A3B","contextWindow":65536}]}}}
          token: ${{ secrets.AGENT_TOKEN }}

"on":
  issue_comment:
    types:
      - created

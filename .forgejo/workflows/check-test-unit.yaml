concurrency:
  cancel-in-progress: true
  group: ${{ forge.ref }}-${{ forge.workflow }}

jobs:
  check:
    container:
      image: git.zarantonello.dev/infra/ci-pnpm:v1.1.26@sha256:b8ccd4eb2ec4aab662d0bab42ebc05c59ca00fff4eb969d2d57b6242a3473bd9
      volumes:
        - forgejo-runner-cache-pnpm:/usr/local/pnpm/store
    name: Run unit tests
    runs-on: srv-generic
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ forge.token }}@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - name: Install dependencies with pnpm
        run: pnpm install
      - name: Run unit tests
        run: pnpm test:unit

name: check-test-unit.yaml

"on":
  pull_request:
    branches:
      - main

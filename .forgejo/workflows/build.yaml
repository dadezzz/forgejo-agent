concurrency:
  cancel-in-progress: true
  group: ${{ forge.ref }}-${{ forge.workflow }}

jobs:
  build:
    container:
      image: git.zarantonello.dev/infra/ci-forgejo-agent:ci@sha256:4afc9384b174bf55a831d87bc1929cc7e58c6796bbf5c1276cc2ba44368df164
      volumes:
        - forgejo-runner-cache-pnpm:/usr/local/pnpm/store
    name: Build the executable
    runs-on: srv-0-nbg-hetz
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ forge.token }}@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - name: Install dependencies with pnpm
        run: pnpm install
      - name: Build
        run: pnpm run build
      - name: Upload the package
        run: |
          curl -s \
            -H "Authorization: Bearer ${{ secrets.REGISTRY_PASSWORD }}" \
            --upload-file dist/ci-forgejo-agent \
            https://git.zarantonello.dev/api/packages/infra/generic/ci-forgejo-agent/${{ forge.ref_name }}/ci-forgejo-agent

name: build.yaml

"on":
  push:
    tags:
      - "*"

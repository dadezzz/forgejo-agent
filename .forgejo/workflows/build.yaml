concurrency:
  cancel-in-progress: true
  group: ${{ forge.ref }}-${{ forge.workflow }}

jobs:
  build:
    container:
      image: git.zarantonello.dev/infra/ci-pnpm:v1.1.8@sha256:e124501d6e8f1e75bb10e9c0e4198f220d37d02c860866ce07e21c87bc6bb886
      volumes:
        - forgejo-runner-cache-pnpm:/usr/local/pnpm/store
    name: Build the executable
    runs-on: srv-hetz-nbg-0
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ forge.token }}@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - name: Install dependencies with pnpm
        run: pnpm install
      - name: Build
        run: pnpm run build
      - name: Upload the package
        run: |
          curl -s \
            -H "Authorization: Bearer ${{ secrets.CI_BOT_REGISTRY_TOKEN }}" \
            --upload-file dist/forgejo-agent \
            https://git.zarantonello.dev/api/packages/projects/generic/forgejo-agent/${{ forge.ref_name }}/forgejo-agent

name: build.yaml

"on":
  push:
    tags:
      - v*

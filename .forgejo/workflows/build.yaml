concurrency:
  cancel-in-progress: true
  group: ${{ forge.ref }}-${{ forge.workflow }}

jobs:
  build:
    container:
      image: git.zarantonello.dev/infra/forgejo-agent:ci@sha256:e1f2da0087b9cb8986dbb12b72262ad966ec41eae28d82107821f92f0cd3b45c
      volumes:
        - forgejo-runner-cache-pnpm:/usr/local/pnpm/store
    name: Build the executable
    runs-on: srv-0-thi-home
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ forge.token }}@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - name: Install dependencies with pnpm
        run: pnpm install
      - name: Build
        run: pnpm run build
      - name: Upload the package
        run: |
          curl \
            -H "Authorization: Bearer ${{ secrets.REGISTRY_PASSWORD }}" \
            --upload-file dist/forgejo-agent \
            https://git.zarantonello.dev/api/packages/infra/generic/forgejo-agent/${{ forge.ref_name }}/forgejo-agent

name: build.yaml

"on":
  push:
    tags:
      - "*"

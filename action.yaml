description: Responds to comments mentioning the username of the agent

inputs:
  auth-token:
    description: Token for authentication
    required: true
  auth-username:
    description: Username to which the bot responds
    required: true
  git-author:
    description: Author for git commits
    required: true
  git-email:
    description: Email for git commits
    required: true

name: ci-forgejo-agent

runs:
  steps:
    - env:
        VERSION: v1.3.12
      name: Fetch the ci-forgejo-agent binary
      run: |
        CACHE="/cache/ci-forgejo-agent/$VERSION/ci-forgejo-agent"

        if [ -f "$CACHE" ]; then
          echo "Cache Hit! Copying from tool cache..."
        else
          echo "Cache Miss! Downloading..."
          mkdir -p "/cache/ci-forgejo-agent/$VERSION/"
          curl -so "$CACHE" "https://git.zarantonello.dev/api/packages/infra/generic/ci-forgejo-agent/$VERSION/ci-forgejo-agent"
        fi

        cp "$CACHE" /usr/local/bin/ci-forgejo-agent
        chmod +x /usr/local/bin/ci-forgejo-agent
      shell: sh
    - name: Run ci-forgejo-agent
      run: |
        export CTX_EVENT_NAME="${{ forge.event_name }}_${{ forge.event.action }}"

        case "$CTX_EVENT_NAME" in
          pull_request_review_requested)
            export CTX_ISSUE_NUMBER="${{ forge.event.pull_request.number }}"
            if [ "${{ forge.event.requested_reviewer.username }}" != "${{ inputs.auth-username }}" ]; then
              echo "@${{ inputs.auth-username }} was not requested for review"
              exit 0
            fi
            ;;
          pull_request_opened)
            export CTX_ISSUE_NUMBER="${{ forge.event.pull_request.number }}"
            if [ ! "${{ contains(forge.event.pull_request.body, inputs.auth.username) }}" ]; then
              echo "@${{ inputs.auth-username }} was not requested for review"
              exit 0
            fi
            ;;
          issue_comment_created)
            export CTX_ISSUE_NUMBER="${{ forge.event.issue.number }}"
            if [ ! "${{ contains(forge.event.comment.body, inputs.auth.username) }}" ]; then
              echo "@${{ inputs.auth-username }} was not requested for review"
              exit 0
            fi
            ;;
          issues_opened)
            export CTX_ISSUE_NUMBER="${{ forge.event.issue.number }}"
            if [ ! "${{ contains(forge.event.issue.body, inputs.auth.username) }}" ]; then
              echo "@${{ inputs.auth-username }} was not requested for review"
              exit 0
            fi
            ;;
        esac

        export CTX_AUTH_TOKEN="${{ inputs.auth-token }}"
        export CTX_AUTH_USERNAME="${{ inputs.auth-username }}"

        # Set author and email if the bot decides to commit its changes.
        git config --global user.name "${{ inputs.git-author }}"
        git config --global user.email "${{ inputs.git-email }}"
        # The agent can simply use git push, without having to set upstream.
        git config --global push.autoSetupRemote true

        ci-forgejo-agent
      shell: sh
  using: composite

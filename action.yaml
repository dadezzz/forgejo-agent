description: Responds to comments mentioning the username of the agent

inputs:
  auth-token:
    description: Token for authentication
    required: true
  auth-username:
    description: Username to which the bot responds
    required: true
  git-author:
    description: Author for git commits
    required: true
  git-email:
    description: Email for git commits
    required: true

name: forgejo-agent

runs:
  steps:
    - env:
        VERSION: v1.2.2
      name: Fetch the forgejo-agent binary
      run: |
        CACHE="/cache/forgejo-agent/$VERSION/forgejo-agent"

        if [ -f "$CACHE" ]; then
          echo "Cache Hit! Copying from tool cache..."
        else
          echo "Cache Miss! Downloading..."
          mkdir -p "/cache/forgejo-agent/$VERSION/"
          curl -o "$CACHE" "https://git.zarantonello.dev/api/packages/infra/generic/forgejo-agent/$VERSION/forgejo-agent"
        fi

        cp "$CACHE" ./forgejo-agent
        chmod +x forgejo-agent
      shell: sh
      # Valid events are:
      # - issue_opened
      # - issue_comment_created
      # - pull_request_opened
      # - pull_request_review_requested
    - name: Run forgejo-agent
      run: |
        export CTX_EVENT_NAME="${{ forge.event_name }}_${{ forge.event.action }}"
        export CTX_ISSUE_NUMBER="${{ forge.event.issue.number }}"

        echo '${{ toJson(forge.event) }}'

        ./forgejo-agent
      shell: sh
  using: composite

services:
  forgejo:
    entrypoint:
      - sh
      - -c
      - |
        # Initialize forgejo config.
        /usr/local/bin/docker-setup.sh
        # Initalize forgejo database.
        forgejo migrate

        # Create the test user as admin: the integration setup provisions the
        # additional users (test-reviewer) through the admin API, keeping the
        # instance bootstrap a single user creation that both the devcontainer
        # and a CI forgejo service can share.
        forgejo admin user create \
          --username "$$FORGEJO_USERNAME" \
          --password "$$FORGEJO_PASSWORD" \
          --email "$$FORGEJO_USERNAME@example.com" \
          --admin \
          --must-change-password=false || true

        # Run web server
        exec /usr/bin/dumb-init -- forgejo web
    env_file: ../src/test/integration/forgejo.env
    environment:
      FORGEJO__security__INSTALL_LOCK: true
      FORGEJO__server__ROOT_URL: http://forgejo:3000/
    image: codeberg.org/forgejo/forgejo:16.0.6-rootless@sha256:51b47921660e1ec7127f094208fe06901ba57df4fe6d59fcccc3a2419514a77f
    ports:
      - 3000:3000
    volumes:
      - forgejo-data:/var/lib/gitea

  workspace:
    entrypoint: sleep infinity
    image: git.zarantonello.dev/infra/ci-pnpm:v1.1.21@sha256:fbc515a4a572b7d74871c861f90105ff2e35f3fc1fcd673735df97b8fae48c8b
    volumes:
      - ..:/workspace:z,cached
      - pnpm-cache:/usr/local/pnpm/store
    working_dir: /workspace

volumes:
  forgejo-data: {}
  pnpm-cache: {}
